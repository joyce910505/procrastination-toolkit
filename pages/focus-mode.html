<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="拖延百寶袋 專注模式 工具"><title>專注模式 | 拖延百寶袋</title><link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/tools/focus-mode.js" defer></script></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html" aria-label="拖延百寶袋首頁"><span class="brand-icon" aria-hidden="true">◕</span>拖延百寶袋</a><nav aria-label="主要導覽"><a href="../index.html#tools">探索工具</a><a href="../index.html#about">關於百寶袋</a></nav></div></header>
<main class="container"><section class="tool-intro" aria-labelledby="tool-title"><a class="back-link" href="../index.html#tools">← 返回工具箱</a><p class="eyebrow">百寶袋道具 04 · 可以使用</p><h1 id="tool-title">專注模式</h1><p class="lead">一次專心做一件事，安排適合自己的專注與休息時間。</p></section>
<section class="tool-columns" aria-label="工具說明"><div class="info-panel"><h2>什麼時候適合使用？</h2><p>當你容易分心，或想先集中精神處理手邊的一件事。</p></div><div class="info-panel"><h2>怎麼使用？</h2><ol><li>填入這次要專注的單一任務。</li><li>設定專注與休息時間（單位：分鐘）。</li><li>開始專注；結束後按下「切換休息」。</li></ol></div></section>
<section class="work-section" aria-labelledby="workspace-title"><div class="work-panel"><h2 id="workspace-title">開始使用</h2><form id="focus-form"><label class="field-label" for="focus-task">這次只專心做哪一件事？</label><input class="text-input" id="focus-task" maxlength="100" placeholder="例如：寫完報告的研究背景" required><div class="focus-inputs"><label>專注（分鐘）<input id="focus-min" class="text-input" type="number" min="1" max="120" value="25" required></label><label>休息（分鐘）<input id="break-min" class="text-input" type="number" min="1" max="60" value="5" required></label></div><button type="submit" class="action-button">儲存設定</button></form><div class="mini-panel"><p class="focus-mode-label" id="focus-phase">專注時間</p><p id="focus-current" class="help-text">先設定今天要專心做的事。</p><p class="timer-readout" id="focus-clock">25:00</p><div class="button-row"><button class="action-button" type="button" id="focus-start">開始</button><button class="secondary-button" type="button" id="focus-pause">暫停</button><button class="secondary-button" type="button" id="focus-reset">重設</button><button class="secondary-button" type="button" id="focus-switch">切換休息／專注</button></div><p class="message" id="focus-feedback" role="status" aria-live="polite"></p><p class="help-text">計時中的狀態不會跨重新整理保留；任務名稱和時間設定會儲存在這台裝置的瀏覽器中。</p></div></div></section></main>
<footer class="site-footer"><div class="container">拖延百寶袋 · 先開始，就有新的可能</div></footer></body></html>
