<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="拖延百寶袋 任務優先排序 工具"><title>任務優先排序 | 拖延百寶袋</title><link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/tools/priority-matrix.js" defer></script></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html" aria-label="拖延百寶袋首頁"><span class="brand-icon" aria-hidden="true">◕</span>拖延百寶袋</a><nav aria-label="主要導覽"><a href="../index.html#tools">探索工具</a><a href="../index.html#about">關於百寶袋</a></nav></div></header>
<main class="container"><section class="tool-intro" aria-labelledby="tool-title"><a class="back-link" href="../index.html#tools">← 返回工具箱</a><p class="eyebrow">百寶袋道具 03 · 可以使用</p><h1 id="tool-title">任務優先排序</h1><p class="lead">事情好多？把任務放進四象限，看看下一步該做什麼。</p></section>
<section class="tool-columns" aria-label="工具說明"><div class="info-panel"><h2>什麼時候適合使用？</h2><p>當你手邊有很多任務，卻不確定哪些要先處理時。</p></div><div class="info-panel"><h2>怎麼使用？</h2><ol><li>輸入一件待辦事項。</li><li>設定是否重要、是否緊急。</li><li>加入對應象限，之後可編輯、刪除或標記完成。</li></ol></div></section>
<section class="work-section" aria-labelledby="workspace-title"><div class="work-panel"><h2 id="workspace-title">開始使用</h2><form id="priority-form"><label class="field-label" for="priority-name">待辦事項</label><input id="priority-name" class="text-input" maxlength="100" required placeholder="例如：交期末報告"><div class="button-row"><label class="check-label"><input id="important" type="checkbox"> 重要</label><label class="check-label"><input id="urgent" type="checkbox"> 緊急</label></div><button class="action-button" type="submit">加入四象限</button></form><p id="priority-feedback" class="message" role="status" aria-live="polite"></p></div><div class="matrix-grid" id="priority-matrix" aria-label="任務四象限"></div><div class="work-panel"><p class="help-text">任務資料會儲存在這台裝置的瀏覽器中；四象限分類由重要性與緊急性決定。</p></div></section></main>
<footer class="site-footer"><div class="container">拖延百寶袋 · 先開始，就有新的可能</div></footer></body></html>
